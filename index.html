<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Conflict Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #111827;
            --panel-bg: #1F2937;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #374151;
            --accent: #3B82F6;
        }

        body[data-theme="light"] {
            --bg-color: #F3F4F6;
            --panel-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --accent: #2563EB;
        }

        body[data-theme="camo"] {
            --bg-color: #C2B280;
            --panel-bg: #8B7355;
            --text-main: #F5F5DC;
            --text-muted: #D2C29D;
            --border-color: #65533D;
            --accent: #4A5D23;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        #map-container {
            flex-grow: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
        }

        #sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        /* Header & Controls */
        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .theme-controls {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 600;
        }

        .theme-btn:hover {
            border-color: var(--accent);
        }

        /* Telemetry Feed */
        .feed-header {
            padding: 12px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            background: rgba(0,0,0,0.1);
        }

        #incident-feed {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
        }

        .feed-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .feed-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .feed-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .feed-title {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 4px;
        }
        
        .feed-source {
            font-size: 0.7rem;
            color: var(--accent);
        }

        /* Leaflet Popup Overrides for Dynamic Growth */
        .leaflet-popup-content-wrapper {
            width: auto !important;
            max-width: 320px !important;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .leaflet-popup-tip {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }

        .leaflet-popup-content {
            margin: 12px 14px !important;
            line-height: 1.4;
        }

        /* Dynamic Hover Card Content */
        .hover-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: normal !important;
            overflow: visible !important;
            text-overflow: clip !important;
        }

        .hover-card-blurb {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-top: 6px;
            white-space: normal;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <div id="sidebar">
        <div class="header">
            <h1>Conflict Tracker</h1>
            <div class="theme-controls">
                <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
                <button class="theme-btn" onclick="setTheme('light')">Light</button>
                <button class="theme-btn" onclick="setTheme('camo')">Desert</button>
            </div>
        </div>
        <div class="feed-header">Live Telemetry</div>
        <div id="incident-feed">
            <!-- Feed items injected here -->
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Theme Switcher Logic
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            updateMapStyle(theme);
        }

        // 2. Initialize Map
        const map = L.map('map', {
            zoomControl: false
        }).setView([33.0, 44.0], 5); // Centered on Middle East

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Map tile layers
        const tiles = {
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }),
            light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }),
            camo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            })
        };

        let currentTileLayer = tiles.dark;
        currentTileLayer.addTo(map);

        function updateMapStyle(theme) {
            map.removeLayer(currentTileLayer);
            currentTileLayer = tiles[theme];
            currentTileLayer.addTo(map);
        }

        // 3. Icon Definitions
        const getIconColor = (type) => {
            switch(type) {
                case 'airstrike': return '#EF4444'; // Red
                case 'missile': return '#F59E0B'; // Orange
                case 'naval': return '#3B82F6'; // Blue
                case 'drone': return '#8B5CF6'; // Purple
                case 'ground': return '#10B981'; // Green
                default: return '#9CA3AF'; // Gray
            }
        };

        const createCustomIcon = (type) => {
            const color = getIconColor(type);
            return L.divIcon({
                className: 'custom-map-marker',
                html: `<div style="background-color: ${color}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
        };

        // Static coordinate mapping for demo purposes
        const locationCoords = {
            "Tehran": [35.6892, 51.3890],
            "Jerusalem": [31.7683, 35.2137],
            "Tel Aviv": [32.0853, 34.7818],
            "Beirut": [33.8938, 35.5018],
            "Damascus": [33.5138, 36.2765],
            "Sanaa": [15.3694, 44.1910],
            "Baghdad": [33.3152, 44.3661],
            "Gaza City": [31.5017, 34.4668],
            "Strait of Hormuz": [26.5667, 56.2500],
            "Eastern Med": [33.0, 33.0]
        };

        // 4. Fetch Data and Render
        async function loadData() {
            try {
                // Add timestamp to bypass GitHub Pages cache
                const response = await fetch(`data.json?v=${new Date().getTime()}`);
                const data = await response.json();
                
                const feedContainer = document.getElementById('incident-feed');
                feedContainer.innerHTML = ''; // Clear feed

                data.incidents.forEach(incident => {
                    // Coordinates fallback
                    const coords = locationCoords[incident.location] || [33.0, 44.0];

                    // Map Marker
                    const marker = L.marker(coords, {
                        icon: createCustomIcon(incident.type)
                    }).addTo(map);

                    // Updated Popup Template (No Open Report link, includes full blurb)
                    const popupHTML = `
                        <div class="hover-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <span style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent);">
                                    ${incident.actor} • ${incident.type}
                                </span>
                                <span style="font-size: 0.68rem; color: var(--text-muted);">${incident.time.split(' ')[0]}</span>
                            </div>
                            
                            <div class="hover-card-title">${incident.title}</div>
                            <div class="hover-card-blurb">${incident.blurb}</div>
                            
                            <div style="margin-top: 10px; font-size: 0.65rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 6px;">
                                Location: ${incident.location} | Source: ${incident.source}
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupHTML);

                    // Sidebar Feed Item
                    const feedItem = document.createElement('div');
                    feedItem.className = 'feed-item';
                    feedItem.innerHTML = `
                        <div class="feed-meta">
                            <span style="color: ${getIconColor(incident.type)}">${incident.type}</span>
                            <span>${incident.time.split(' ')[0] || 'Recent'}</span>
                        </div>
                        <div class="feed-title">${incident.title}</div>
                        <div class="feed-source">${incident.location} • ${incident.source}</div>
                    `;
                    
                    // Click feed item to open popup on map
                    feedItem.addEventListener('click', () => {
                        map.setView(coords, 7);
                        marker.openPopup();
                    });

                    feedContainer.appendChild(feedItem);
                });

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('incident-feed').innerHTML = '<div style="padding: 20px; color: #EF4444;">Error loading telemetry data. Please check data.json.</div>';
            }
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
