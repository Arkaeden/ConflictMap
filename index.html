<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Situation Map — Iran Conflict Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #f7f7f7;
            --panel-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --accent-color: #000000;
            --font-stack: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header Navigation */
        header {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Interactive Map Area */
        #map {
            flex: 1;
            background-color: #e5e5e5;
            height: 100%;
        }

        /* Sidebar Live Feed */
        .sidebar {
            width: 380px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: #fafafa;
        }

        .feed-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            list-style: none;
        }

        .feed-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .feed-item:hover {
            background-color: #f0f0f0;
        }

        .feed-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .feed-actor {
            color: var(--text-main);
            background: #e9e9e9;
            padding: 2px 6px;
            border-radius: 2px;
        }

        .feed-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .feed-time {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Bottom Map Legend Bar */
        .legend-bar {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px 32px;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #444444;
            z-index: 1000;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom Map Marker Styling */
        .custom-map-icon {
            background: #ffffff;
            border: 2px solid #111111;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }

        .custom-map-icon:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        .custom-map-icon svg {
            width: 14px;
            height: 14px;
            fill: #111111;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Regional Situation Map — Iran Conflict Tracker</div>
        <div class="status-badge">
            <span class="pulse-dot"></span>
            <span id="last-updated">Updating Live Feed...</span>
        </div>
    </header>

    <div class="workspace">
        <div id="map"></div>
        
        <div class="sidebar">
            <div class="sidebar-header">Live Intelligence Feed</div>
            <ul class="feed-list" id="feed-container">
                <!-- Feed items injected dynamically -->
            </ul>
        </div>
    </div>

    <!-- Map Legend Component -->
    <div class="legend-bar">
        <div class="legend-item">
            <div class="legend-icon" id="leg-airstrike"></div>
            <span>Airstrike</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-missile"></div>
            <span>Missile Fire</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-drone"></div>
            <span>Drone Activity</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-naval"></div>
            <span>Naval Activity</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-ground"></div>
            <span>Ground Forces</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-cyber"></div>
            <span>Cyber Activity</span>
        </div>
        <div class="legend-item">
            <div class="legend-icon" id="leg-diplomatic"></div>
            <span>Diplomatic / Other</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Vector Map Coordinates Database
        const CITY_COORDINATES = {
            "Tehran": [35.6892, 51.3890],
            "Natanz": [33.5131, 51.9161],
            "Fordow": [34.8842, 50.9958],
            "Isfahan": [32.6546, 51.6680],
            "Bushehr": [28.9234, 50.8203],
            "Bandar Abbas": [27.1832, 56.2666],
            "Tel Aviv": [32.0853, 34.7818],
            "Jerusalem": [31.7683, 35.2137],
            "Haifa": [32.7940, 34.9896],
            "Eilat": [29.5581, 34.9482],
            "Gaza City": [31.5017, 34.4668],
            "Rafah": [31.2968, 34.2435],
            "Golan Heights": [33.1464, 35.7537],
            "Beirut": [33.8938, 35.5018],
            "Tyre": [33.2705, 35.2038],
            "Damascus": [33.5138, 36.2765],
            "Baghdad": [33.3152, 44.3661],
            "Erbil": [36.1901, 44.0091],
            "Amman": [31.9454, 35.9284],
            "Riyadh": [24.7136, 46.6753],
            "Sanaa": [15.3694, 44.1910],
            "Hodeidah": [14.7978, 42.9545],
            "Aden": [12.7855, 45.0187],
            "Bab-el-Mandeb": [12.5833, 43.3333],
            "Eastern Med": [34.5000, 33.0000]
        };

        // 2. SVG Icon Library for All Incident Types
        const EVENT_ICONS = {
            'airstrike': `<svg viewBox="0 0 24 24"><path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z"/></svg>`,
            'missile': `<svg viewBox="0 0 24 24"><path d="M12 2L15 8V16L12 22L9 16V8L12 2Z"/></svg>`,
            'drone': `<svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm12 0h4v4h-4V4zM4 16h4v4H4v-4zm12 0h4v4h-4v-4zm-5-7h2v6h-2V9z"/></svg>`,
            'naval': `<svg viewBox="0 0 24 24"><path d="M3 16l2 4h14l2-4H3zm1-3l2-5h12l2 5H4z"/></svg>`,
            'ground': `<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            'cyber': `<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm4 4v8h8V8H8z"/></svg>`,
            'diplomatic': `<svg viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6h-5.6z"/></svg>`
        };

        // 3. Populate Legend Icons
        Object.keys(EVENT_ICONS).forEach(type => {
            const el = document.getElementById(`leg-${type}`);
            if (el) el.innerHTML = EVENT_ICONS[type];
        });

        // 4. Initialize Map
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([29.0, 42.0], 5);

        // Standard clean tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 18,
            subdomains: 'abcd'
        }).addTo(map);

        let activeMarkers = [];

        // 5. Render Incidents strictly using `incident.type`
        function renderData(data) {
            // Update Header Time
            if (data.lastUpdated) {
                const dateObj = new Date(data.lastUpdated);
                document.getElementById('last-updated').textContent = `LIVE FEED — ${dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} UTC`;
            }

            // Clear markers
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            if (!data.incidents || data.incidents.length === 0) {
                feedContainer.innerHTML = '<li class="feed-item"><div class="feed-title">No recent updates recorded.</div></li>';
                return;
            }

            data.incidents.forEach((incident, index) => {
                // Determine SVG strictly based on incident.type
                const eventType = (incident.type && EVENT_ICONS[incident.type]) ? incident.type : 'diplomatic';
                const svgMarkup = EVENT_ICONS[eventType];

                // Get coordinates
                const coords = CITY_COORDINATES[incident.location] || CITY_COORDINATES["Eastern Med"];

                // Create custom Leaflet icon
                const customIcon = L.divIcon({
                    className: 'custom-map-icon',
                    html: svgMarkup,
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });

                // Add Marker to Map
                const marker = L.marker(coords, { icon: customIcon }).addTo(map);
                
                // Add Popup
                marker.bindPopup(`
                    <div style="font-family: var(--font-stack); padding: 4px;">
                        <strong style="text-transform: uppercase; font-size: 11px; color: #666;">${incident.location} — ${eventType}</strong>
                        <h4 style="font-size: 13px; margin: 4px 0;">${incident.title}</h4>
                        <a href="${incident.url}" target="_blank" style="font-size: 11px; color: #000; font-weight: bold;">Read Source →</a>
                    </div>
                `);

                activeMarkers.push(marker);

                // Create Sidebar Feed Item
                const li = document.createElement('li');
                li.className = 'feed-item';
                li.innerHTML = `
                    <div class="feed-meta">
                        <span class="feed-actor">${incident.actor}</span>
                        <span>${eventType}</span>
                        <span>• ${incident.location}</span>
                    </div>
                    <div class="feed-title">${incident.title}</div>
                    <div class="feed-time">${incident.source || 'News Source'}</div>
                `;

                // Click feed item to pan map to location
                li.addEventListener('click', () => {
                    map.flyTo(coords, 7, { duration: 1.2 });
                    marker.openPopup();
                });

                feedContainer.appendChild(li);
            });
        }

        // 6. Fetch live data.json file
        fetch('data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('Data payload not found');
                return response.json();
            })
            .then(data => renderData(data))
            .catch(err => {
                console.error("Error loading feed data:", err);
                document.getElementById('last-updated').textContent = "FEED OFFLINE";
            });
    </script>
</body>
</html>
