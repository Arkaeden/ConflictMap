<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Telemetry Tracker</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS Reset & Core Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #eee;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Grid */
        #sidebar {
            width: 380px;
            background-color: #0a0a0a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            z-index: 1;
        }

        /* Typography & Functional Elements */
        .header {
            padding: 24px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
        }

        .feed-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .incident-card {
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .incident-meta {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .incident-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        /* Hover Card Popup Styling */
        .leaflet-popup-content-wrapper {
            background-color: #16181D;
            color: #eee;
            border-radius: 4px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .leaflet-popup-tip {
            background-color: #16181D;
            border: 1px solid #333;
        }

        .popup-content {
            padding: 8px 4px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .popup-tag {
            font-size: 10px;
            color: #FF4500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .popup-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .popup-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* The Button Fix */
        .report-btn {
            display: inline-block;
            background-color: transparent;
            color: #FF4500;
            border: 1px solid #FF4500;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .report-btn:hover:not(.disabled) {
            background-color: #FF4500;
            color: #fff;
        }

        .report-btn.disabled {
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>Regional Telemetry</h1>
        </div>
        <div class="feed-container" id="feed">
            <!-- Feed items will inject here -->
        </div>
    </div>
    
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Dark Mode Map
        const map = L.map('map', {
            zoomControl: false // Minimalist UI
        }).setView([33.0, 40.0], 5); // Center on Middle East
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Geolocation mapping for standard cities
        const cityCoords = {
            "Tehran": [35.6892, 51.3890],
            "Jerusalem": [31.7683, 35.2137],
            "Beirut": [33.8938, 35.5018],
            "Damascus": [33.5138, 36.2765],
            "Baghdad": [33.3152, 44.3661],
            "Sanaa": [15.3694, 44.1910],
            "Gaza City": [31.5017, 34.4668],
            "Tel Aviv": [32.0853, 34.7818],
            "Strait of Hormuz": [26.5667, 56.2500],
            "Eastern Med": [33.0, 33.0]
        };

        // 2. Fetch Data with Cache Busting
        async function loadData() {
            try {
                // The dynamic timestamp prevents GitHub Pages from serving a cached JSON file
                const cacheBuster = new Date().getTime();
                const response = await fetch(`data.json?t=${cacheBuster}`);
                
                if (!response.ok) throw new Error("Data file not found");
                
                const data = await response.json();
                renderFeedAndMap(data.incidents);
                
            } catch (error) {
                console.error("Error loading telemetry:", error);
                document.getElementById('feed').innerHTML = `<p style="color:#666; font-size: 12px;">Waiting for telemetry data...</p>`;
            }
        }

        // 3. Render Logic with Safe Button Fallbacks
        function renderFeedAndMap(incidents) {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = '';

            incidents.forEach(incident => {
                // Populate Sidebar
                const card = document.createElement('div');
                card.className = 'incident-card';
                card.innerHTML = `
                    <span class="incident-meta">${incident.time.split('T')[0]} // ${incident.source}</span>
                    <div class="incident-title">${incident.title}</div>
                `;
                feedDiv.appendChild(card);

                // Populate Map Marker
                if (incident.location && cityCoords[incident.location]) {
                    const coords = cityCoords[incident.location];
                    
                    // Button Safety Check: Only create a working link if the URL is valid
                    const isValidLink = incident.url && incident.url !== '#' && incident.url !== '';
                    
                    const popupHTML = `
                        <div class="popup-content">
                            <span class="popup-tag">${incident.actor} // ${incident.type}</span>
                            <div class="popup-title">${incident.title}</div>
                            <div class="popup-desc">${incident.blurb}</div>
                            
                            ${isValidLink 
                                ? `<a href="${incident.url}" target="_blank" rel="noopener noreferrer" class="report-btn">OPEN REPORT &rarr;</a>`
                                : `<span class="report-btn disabled">LINK UNAVAILABLE</span>`
                            }
                        </div>
                    `;

                    L.circleMarker(coords, {
                        radius: 6,
                        fillColor: "#FF4500",
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup(popupHTML);
                }
            });
        }

        // Boot up
        loadData();
    </script>
</body>
</html>
